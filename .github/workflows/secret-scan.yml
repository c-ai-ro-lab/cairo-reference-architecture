name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      # Open-source gitleaks CLI (MIT). Runs without a license key, unlike
      # gitleaks/gitleaks-action@v2 on organization-owned repositories.
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz. Update both values together.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks CLI (pinned version, checksum verified)
        run: |
          set -euo pipefail
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o "$file" "$base/$file"
          echo "${GITLEAKS_SHA256}  ${file}" | sha256sum --check --strict
          mkdir -p gitleaks-bin
          tar -xzf "$file" -C gitleaks-bin gitleaks
          ./gitleaks-bin/gitleaks version
      - name: Scan full git history
        run: |
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git --redact --verbose --exit-code 1 .
