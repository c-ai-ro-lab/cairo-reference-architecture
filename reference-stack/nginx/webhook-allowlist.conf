# nginx-webhooks: path allowlist between the Cloudflare tunnel and n8n.
#
# Only n8n webhook paths are forwarded. Everything else, including the n8n
# editor, REST API, and login page, returns 403 Forbidden. The admin UI is
# reached only over the zero-trust connection, never through this proxy.

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 5m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Production webhooks
    location /webhook/ {
        limit_except GET POST { deny all; }
        proxy_pass http://n8n:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Test webhooks (consider disabling in production)
    location /webhook-test/ {
        limit_except GET POST { deny all; }
        proxy_pass http://n8n:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Deny everything else
    location / {
        return 403;
    }
}
